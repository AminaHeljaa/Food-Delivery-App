<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants | Food Delivery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
            color: #263238;
        }

        header {
            background: #173b32;
            color: white;
            padding: 24px;
            border-radius: 14px;
        }

        nav a {
            color: white;
            margin-right: 20px;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 14px #00000010;
        }

        .button {
            display: inline-block;
            background: #e87535;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<header>
    <h1>🍽️ Food Delivery</h1>
    <p>Discover restaurants and find your next favourite meal.</p>

    <nav>
        <a th:href="@{/a}">Restaurants</a>
        <a th:href="@{/b}">Meals</a>
    </nav>
</header>

<h2>Available Restaurants</h2>

<div class="grid">
    <div class="card" th:each="restaurant : ${restaurants}">
        <h3 th:text="${restaurant.name}">Restaurant name</h3>

        <p>
            📍 <span th:text="${restaurant.city}">City</span>
        </p>

        <p>
            Cuisine:
            <strong th:text="${restaurant.cuisine}">Cuisine</strong>
        </p>

        <p>
            ⭐ <span th:text="${restaurant.rating}">5.0</span>
        </p>

        <p>
            Available meals:
            <strong th:text="${#lists.size(restaurant.meals)}">0</strong>
        </p>

        <a class="button"
           th:href="@{/a/action/{id}(id=${restaurant.id})}">
            View restaurant
        </a>
    </div>
</div>

</body>
</html>

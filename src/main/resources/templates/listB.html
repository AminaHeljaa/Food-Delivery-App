<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meals | Food Delivery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
            color: #263238;
        }

        header {
            background: #173b32;
            color: white;
            padding: 24px;
            border-radius: 14px;
        }

        nav a {
            color: white;
            margin-right: 20px;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .card {
            background: white;
            padding: 22px;
            border-radius: 14px;
            box-shadow: 0 4px 14px #00000010;
        }

        .price {
            color: #18794e;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>🥗 Our Meals</h1>
    <p>Explore delicious food from our restaurants.</p>

    <nav>
        <a th:href="@{/a}">Restaurants</a>
        <a th:href="@{/b}">Meals</a>
    </nav>
</header>

<h2>Available Meals</h2>

<div class="grid">
    <div class="card" th:each="meal : ${meals}">
        <h3 th:text="${meal.name}">Meal name</h3>

        <p>
            Category:
            <span th:text="${meal.category}">Category</span>
        </p>

        <p>
            Restaurant:
            <strong th:text="${meal.restaurant.name}">Restaurant</strong>
        </p>

        <p class="price">
            <span th:text="${#numbers.formatDecimal(meal.price, 1, 2)}">0.00</span>
            KM
        </p>

        <p th:if="${meal.vegetarian}">🌱 Vegetarian</p>
        <p th:unless="${meal.vegetarian}">🍗 Non-vegetarian</p>

        <a th:href="@{/a/action/{id}(id=${meal.restaurant.id})}">
            View restaurant
        </a>
    </div>
</div>

</body>
</html>
